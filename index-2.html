    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, updateDoc, doc, addDoc, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAKGg9NEx...",
            authDomain: "wineslc.firebaseapp.com",
            projectId: "wineslc",
            storageBucket: "wineslc.firebasestorage.app",
            messagingSenderId: "141685304434",
            appId: "1:141685304434:web:7c59e806ff4051025c66eb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Cargar nombres de vinos activos
        async function cargarNombresVinos() {
            const q = query(collection(db, "vinos"), where("estado", "==", "Activo"));
            const vinosSnapshot = await getDocs(q);
            const nombresUnicos = new Set();

            vinosSnapshot.forEach(doc => {
                const vino = doc.data();
                nombresUnicos.add(vino.nombre);
            });

            const selectVino = document.getElementById("nombreVino");
            selectVino.innerHTML = '<option value="">Seleccione un vino</option>';
            nombresUnicos.forEach(nombre => {
                const option = document.createElement("option");
                option.value = nombre;
                option.textContent = nombre;
                selectVino.appendChild(option);
            });
        }

        // Agregar venta
        async function agregarVenta(event) {
            event.preventDefault();
            const nombreVino = document.getElementById("nombreVino").value;
            const cantidad = parseInt(document.getElementById("cantidad").value);
            const cliente = document.getElementById("cliente").value;
            const fechaVenta = document.getElementById("fechaVenta").value;

            if (!nombreVino || cantidad <= 0 || !cliente || !fechaVenta) {
                alert("Complete todos los campos correctamente.");
                return;
            }

            // Consultar vinos activos ordenados por ID
            const q = query(
                collection(db, "vinos"),
                where("nombre", "==", nombreVino),
                where("estado", "==", "Activo"),
                orderBy("id", "asc")
            );
            const vinosSnapshot = await getDocs(q);

            if (vinosSnapshot.size < cantidad) {
                alert("No hay suficiente stock disponible.");
                return;
            }

            // Tomar los primeros 'n' vinos según la cantidad
            let contador = 0;
            for (const docSnap of vinosSnapshot.docs) {
                if (contador < cantidad) {
                    const vino = docSnap.data();
                    // Registrar la venta
                    await addDoc(collection(db, "ventas"), {
                        nombreVino: nombreVino,
                        cantidad: 1,
                        precioTotal: vino.precio,
                        cliente: cliente,
                        fechaVenta: fechaVenta,
                        estado: "Inactivo",
                        codigoUnico: vino.codigoUnico,
                        ventaCancelada: "Inactivo" // Nuevo campo
                    });
                    // Actualizar el estado del vino a "Inactivo"
                    await updateDoc(doc(db, "vinos", docSnap.id), { estado: "Inactivo" });
                    contador++;
                } else {
                    break;
                }
            }

            alert("Venta registrada correctamente.");
            cargarVentas();
            cargarResumenVentas();
            document.getElementById("formVentas").reset();
        }

        // Cargar ventas
        async function cargarVentas() {
            const q = query(collection(db, "ventas"));
            const ventasSnapshot = await getDocs(q);
            const tbody = document.getElementById("tablaVentas").querySelector("tbody");
            tbody.innerHTML = "";

            ventasSnapshot.forEach(async docSnap => {
                const venta = docSnap.data();

                // Verificar el estado del vino en la colección "vinos"
                const qVino = query(collection(db, "vinos"), where("codigoUnico", "==", venta.codigoUnico));
                const vinosSnapshot = await getDocs(qVino);

                if (!vinosSnapshot.empty) {
                    const vino = vinosSnapshot.docs[0].data();

                    // Solo mostrar la venta si el vino está "Inactivo" y la venta no está cancelada
                    if (vino.estado === "Inactivo" && venta.ventaCancelada === "Inactivo") {
                        const newRow = document.createElement("tr");
                        newRow.innerHTML = `
                            <td>${venta.nombreVino}</td>
                            <td>${venta.cantidad}</td>
                            <td>${venta.precioTotal}</td>
                            <td>${venta.cliente}</td>
                            <td>${venta.fechaVenta}</td>
                            <td>${venta.estado}</td>
                            <td>${venta.codigoUnico}</td>
                            <td><img src="https://api.qrserver.com/v1/create-qr-code/?data=${venta.codigoUnico}&size=150x150"></td>
                            <td><button class="btn-cambiar-estado">Cambiar Estado</button></td>
                        `;

                        // Asignar el evento de clic al botón
                        const botonCambiarEstado = newRow.querySelector(".btn-cambiar-estado");
                        botonCambiarEstado.addEventListener("click", async () => {
                            await cambiarEstado(docSnap.id, venta.codigoUnico);
                        });

                        tbody.appendChild(newRow);
                    }
                }
            });
        }

        // Cambiar estado del vino
        async function cambiarEstado(ventaId, codigoUnico) {
            const qVino = query(collection(db, "vinos"), where("codigoUnico", "==", codigoUnico));
            const vinosSnapshot = await getDocs(qVino);

            if (!vinosSnapshot.empty) {
                const vinoDoc = vinosSnapshot.docs[0];
                await updateDoc(doc(db, "vinos", vinoDoc.id), { estado: "Activo" });
                await updateDoc(doc(db, "ventas", ventaId), { ventaCancelada: "Activo" }); // Cambiar estado de ventaCancelada
                alert("Estado cambiado a Activo.");
                cargarVentas();
                cargarResumenVentas();
            }
        }

        // Cargar resumen de ventas por fecha y nombre del vino
        async function cargarResumenVentas() {
            const ventasSnapshot = await getDocs(collection(db, "ventas"));
            const ventasPorFecha = {};

            // Agrupar ventas por fecha, nombre del vino y cliente
            for (const doc of ventasSnapshot.docs) {
                const venta = doc.data();

                // Verificar el estado del vino en la colección "vinos"
                const qVino = query(collection(db, "vinos"), where("codigoUnico", "==", venta.codigoUnico));
                const vinosSnapshot = await getDocs(qVino);

                if (!vinosSnapshot.empty) {
                    const vino = vinosSnapshot.docs[0].data();

                    // Solo incluir la venta en el resumen si el vino está "Inactivo" y la venta no está cancelada
                    if (vino.estado === "Inactivo" && venta.ventaCancelada === "Inactivo") {
                        const fecha = venta.fechaVenta;
                        const nombreVino = venta.nombreVino;
                        const cliente = venta.cliente;

                        if (!ventasPorFecha[fecha]) {
                            ventasPorFecha[fecha] = {
                                totalVentas: 0,
                                totalPrecio: 0,
                                vinos: {}
                            };
                        }

                        if (!ventasPorFecha[fecha].vinos[nombreVino]) {
                            ventasPorFecha[fecha].vinos[nombreVino] = {
                                cantidad: 0,
                                precioTotal: 0,
                                clientes: {} // Agrupar por cliente
                            };
                        }

                        if (!ventasPorFecha[fecha].vinos[nombreVino].clientes[cliente]) {
                            ventasPorFecha[fecha].vinos[nombreVino].clientes[cliente] = {
                                cantidad: 0,
                                precioTotal: 0
                            };
                        }

                        ventasPorFecha[fecha].vinos[nombreVino].clientes[cliente].cantidad += 1; // Sumar cantidad por cliente
                        ventasPorFecha[fecha].vinos[nombreVino].clientes[cliente].precioTotal += venta.precioTotal; // Sumar precios por cliente
                        ventasPorFecha[fecha].totalVentas += 1; // Contar ventas totales
                        ventasPorFecha[fecha].totalPrecio += venta.precioTotal; // Sumar precios totales
                    }
                }
            }

            // Mostrar el resumen en la tabla
            const tablaResumen = document.getElementById("tablaResumenVentas");
            if (tablaResumen) {
                const tbody = tablaResumen.querySelector("tbody");
                tbody.innerHTML = "";

                for (const fecha in ventasPorFecha) {
                    const resumen = ventasPorFecha[fecha];

                    // Fila de fecha
                    tbody.innerHTML += `<tr class="fecha-row">
                        <td colspan="5" class="text-center"><strong>${fecha}</strong></td>
                    </tr>`;

                    // Filas de vinos y clientes
                    for (const nombreVino in resumen.vinos) {
                        const vino = resumen.vinos[nombreVino];
                        for (const cliente in vino.clientes) {
                            const clienteInfo = vino.clientes[cliente];
                            tbody.innerHTML += `<tr>
                                <td>${nombreVino}</td>
                                <td>${cliente}</td>
                                <td>${clienteInfo.cantidad}</td>
                                <td>${clienteInfo.precioTotal.toFixed(2)}</td>
                                <td></td>
                            </tr>`;
                        }
                    }

                    // Fila de total por fecha
                    tbody.innerHTML += `<tr class="total-row">
                        <td><strong>Total</strong></td>
                        <td></td>
                        <td>${resumen.totalVentas}</td>
                        <td>${resumen.totalPrecio.toFixed(2)}</td>
                        <td></td>
                    </tr>`;
                }
            } else {
                console.error("No se encontró la tabla de resumen de ventas.");
            }
        }

        // Eventos
        document.getElementById("formVentas").addEventListener("submit", agregarVenta);
        document.addEventListener("DOMContentLoaded", () => {
            cargarNombresVinos();
            cargarVentas();
            cargarResumenVentas();
        });
    </script>
</head>

    <div class="container mt-4 content-box">
