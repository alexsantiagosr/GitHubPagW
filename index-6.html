    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
    
        // Configuración de Firebase
        const firebaseConfig = {
        apiKey: "AIzaSyAKGg9NEx...",
        authDomain: "wineslc.firebaseapp.com",
        projectId: "wineslc",
        storageBucket: "wineslc.firebasestorage.app",
        messagingSenderId: "141685304434",
        appId: "1:141685304434:web:7c59e806ff4051025c66eb"
    };
    
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
    
        // Definir la función en `window` para hacerla accesible desde el HTML
        window.verificarCodigo = async function verificarCodigo() {
    let codigo = document.getElementById("codigoInput").value.trim(); // Eliminar espacios en blanco
    const vinosRef = collection(db, "vinos");
    const vinosSnap = await getDocs(vinosRef);

    let mensaje = "❌ Vino Falso"; // Mensaje por defecto si no se encuentra

    vinosSnap.forEach((doc) => {
        let data = doc.data();
        let codigoUnico = String(data.codigoUnico).trim(); // Asegurar conversión a string y eliminar espacios
        
        if (codigoUnico === codigo) {
            if (data.estado.toLowerCase() === "activo") {
                mensaje = "✅ Vino Original en Stock";
            } else if (data.estado.toLowerCase() === "inactivo") {
                mensaje = "✅ Vino Original";
            }
        }
    });

    document.getElementById("resultado").innerText = mensaje;
};

    </script>
