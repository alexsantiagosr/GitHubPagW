   <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
 
    // Configuración de Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyAKGg9NEx...",
        authDomain: "wineslc.firebaseapp.com",
        projectId: "wineslc",
        storageBucket: "wineslc.firebasestorage.app",
        messagingSenderId: "141685304434",
        appId: "1:141685304434:web:7c59e806ff4051025c66eb"
    };
 
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
 
    // Función para obtener el último ID y generar el siguiente
    async function getNextId() {
        const docRef = doc(db, "config", "lastId");
        const docSnap = await getDoc(docRef);
 
        let lastId = 0;
        if (docSnap.exists()) {
            lastId = docSnap.data().value;
        }
 
        const newId = lastId + 1;
        await setDoc(docRef, { value: newId });
        return newId;
    }
 
    // Generador de código único estilo Blockchain
    function generateUniqueCode() {
        const hex = "0123456789abcdef";
        let code = "0x";
        for (let i = 0; i < 64; i++) {
            code += hex[Math.floor(Math.random() * 16)];
        }
        return code;
    }
 
    async function loadVinos() {
    try {
        const q = query(collection(db, "vinos"), orderBy("id", "asc")); // Ordenado por ID ascendente
        const querySnapshot = await getDocs(q);
        const tbody = document.querySelector("#tablaVinos tbody");
        tbody.innerHTML = "";

        if (querySnapshot.empty) {
            console.log("No hay datos en Firebase.");
            tbody.innerHTML = `<tr><td colspan="9" class="text-center">No hay vinos registrados</td></tr>`;
            return;
        }

        querySnapshot.forEach(async (doc) => {
            const vino = doc.data();
            let newRow = `<tr data-id="${doc.id}">
                            <td>${vino.id ?? "Sin ID"}</td>
                            <td>${vino.nombre}</td>
                            <td>${vino.categoria}</td>
                            <td>${vino.cantidad}</td>
                            <td>${vino.precio}</td>
                            <td>${vino.codigoUnico}</td>
                            <td id="qr-${vino.id}"></td>
                            <td>${vino.estado}</td>
                            <td>
                                <button class='btn btn-warning btnEstado'>Cambiar Estado</button>
                            </td>
                          </tr>`;
            tbody.innerHTML += newRow;

            let qrContainer = await generateQRCode(vino.codigoUnico, vino.id);
            document.getElementById(`qr-${vino.id}`).appendChild(qrContainer);
        });

        document.querySelectorAll(".btnEstado").forEach(button => {
            button.addEventListener("click", async function () {
                let row = this.closest("tr");
                let docId = row.getAttribute("data-id");
                let estadoActual = row.cells[7].textContent;
                let nuevoEstado = estadoActual === "Activo" ? "Inactivo" : "Activo";

                let confirmar = confirm(`¿Deseas cambiar el estado a ${nuevoEstado}?`);
                if (confirmar) {
                    await setDoc(doc(db, "vinos", docId), { estado: nuevoEstado }, { merge: true });
                    row.cells[7].textContent = nuevoEstado;
                }
            });
        });

    } catch (error) {
        console.error("Error al cargar los vinos:", error);
    }
}

async function generateQRCode(codigoUnico, id) {
    let qrContainer = document.createElement("div");
    qrContainer.id = `qrcode-${id}`;
    new QRCode(qrContainer, {
        text: `https://tusitio.com/verificar?codigo=${codigoUnico}`,
        width: 200,
        height: 200
    });
    return qrContainer;
}

document.getElementById("btnAgregar").addEventListener("click", async function (event) {
    event.preventDefault();

    let nombre = document.getElementById("nombre").value;
    let categoria = document.getElementById("categoria").value;
    let cantidad = parseInt(document.getElementById("cantidad").value);
    let precio = parseFloat(document.getElementById("precio").value);

    if (nombre && categoria && cantidad > 0 && precio > 0) {
        for (let i = 0; i < cantidad; i++) {
            let id = await getNextId();
            let codigoUnico = generateUniqueCode();

            await addDoc(collection(db, "vinos"), {
                id: id,
                nombre: nombre,
                categoria: categoria,
                cantidad: 1,
                precio: precio,
                codigoUnico: codigoUnico,
                estado: "Activo"
            });
        }

        document.getElementById("formVinos").reset();
        loadVinos();
    } else {
        alert("Por favor, completa todos los campos correctamente.");
    }
});

document.addEventListener("DOMContentLoaded", loadVinos);
